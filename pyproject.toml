[project]
name = "mao"
version = "0.6.0"
description = "自研多智能体协作系统：多个免费/较弱模型分工协作（三个臭皮匠顶个诸葛亮）"
readme = "README.md"
authors = [
    { name = "minyaohua", email = "minyaohua@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "mcp>=2.0,<3",   # server 端用到 2.x 的 MCPServer（原 FastMCP）；1.x 无此 API
    "PyYAML>=6.0",
]

[project.scripts]
mao = "agent.__main__:main"

# 依赖索引在项目里钉死，不跟随各机器的 uv 全局配置（本机 uv.toml 默认走清华镜像）。
# 为什么：uv.lock 里记录的是**具体下载 URL**，锁文件用镜像生成、CI 在 GitHub runner 上
# 就照着镜像 URL 拉全树（境外访问国内镜像，慢且不稳）；反过来锁在 PyPI、本地一跑
# `uv sync` 又会把 URL 翻回镜像 —— 两份锁来回打架，diff 噪音之外还让 CI 时好时坏。
# 代价：本机装依赖走 pypi.org，比国内镜像慢（只在依赖变化时付一次）。
# 想换回镜像：删掉本段并 `uv lock`（CI 那侧则改成锁镜像 URL）。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

# 打包根目录下的 agent 包（仓库已无 src/，历史上 uv init 占位目录已移除）
[tool.uv.build-backend]
module-root = ""
module-name = "agent"

# ---------- 代码质量门禁 ----------
[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "W", "I", "B", "UP"]
lint.ignore = ["B008", "E501"]
# 用 extend-exclude（追加到 ruff 默认排除表）而不是 exclude（整体替换）。
# exclude 会连 .venv/.git/__pycache__/.pytest_cache 等默认排除项一起顶掉，
# 于是这些目录重新进入扫描范围、只能靠 .gitignore 兜着——而 .gitignore 曾因
# 行内注释整条失效，两处一起坏就会让 lint 扫到隔离区的旧文件。
# data/ = 运行时产物与隔离区（会话 JSONL、人工/历史隔离文件），不参与 lint。
# 旧骨架 examples/archive/multi_ai_orchestrator.py 已移入 data/trash 隔离，不再需要单独排除。
extend-exclude = ["data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 开发依赖（lint / test），不进分发产物
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]