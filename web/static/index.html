<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多功能智能体</title>
<!-- 空 data URI 图标：浏览器默认会去请求 /favicon.ico，本服务没有该路由 → 每次都留一条
     404 资源错误（实测在控制台里出现"Failed to load resource: 404"），干扰排查真实 JS 问题。 -->
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #f3f5f9; color: #1f2329; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #4f6ef7 0%, #7c4ff7 100%);
    color: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 8px rgba(79,110,247,.25);
  }
  header .logo { font-size: 20px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .85; margin-left: 10px; }
  .orchsel {
    margin-left: auto; background: rgba(255,255,255,.15); color: #fff;
    border: 1px solid rgba(255,255,255,.35); border-radius: 8px;
    padding: 5px 8px; font-size: 12.5px; outline: none; max-width: 240px;
  }
  .orchsel option { color: #1f2329; }
  #chat { flex: 1; overflow-y: auto; padding: 22px 16%; }
  .row { display: flex; margin-bottom: 16px; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.65; font-size: 14px; word-break: break-word; white-space: pre-wrap;
  }
  .user .bubble { background: #4f6ef7; color: #fff; border-bottom-right-radius: 4px; }
  .assistant .bubble { background: #fff; border: 1px solid #e5e8ef; border-bottom-left-radius: 4px; }
  .tools { margin-bottom: 12px; }
  .tool {
    background: #fff; border: 1px solid #e5e8ef; border-radius: 8px;
    font-size: 12.5px; margin-bottom: 6px; overflow: hidden;
  }
  .tool summary {
    padding: 7px 12px; cursor: pointer; color: #5b6472; user-select: none;
    display: flex; align-items: center; gap: 6px; list-style: none;
  }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary .dot { width: 7px; height: 7px; border-radius: 50%; background: #34c77b; flex: none; }
  .tool pre {
    margin: 0; padding: 8px 12px; background: #f7f8fa; border-top: 1px solid #eef0f4;
    max-height: 220px; overflow: auto; white-space: pre-wrap; color: #444;
  }
  .err { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322;
    padding: 10px 14px; border-radius: 10px; font-size: 13.5px; margin-bottom: 12px; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: #9aa4b5;
    animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }
  footer { padding: 14px 16% 20px; background: transparent; }
  .inputbar {
    display: flex; gap: 10px; background: #fff; border: 1px solid #dfe3ea;
    border-radius: 14px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(31,35,41,.05);
  }
  textarea {
    flex: 1; border: none; outline: none; resize: none; font: inherit;
    font-size: 14px; max-height: 140px; background: transparent; line-height: 1.5;
  }
  button {
    border: none; background: #4f6ef7; color: #fff; padding: 8px 20px;
    border-radius: 10px; font-size: 14px; cursor: pointer; flex: none;
  }
  button:disabled { background: #b9c3f5; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11.5px; color: #98a1af; margin-top: 8px; }
  code { background: #eef1f6; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .bubble pre.codeblock { background: #f0f2f7; padding: 8px 10px; border-radius: 8px;
    overflow-x: auto; margin: 6px 0; white-space: pre-wrap; }
  /* 并行派工卡：逐工人实时进度 + 「采纳已完成、结束派工」 */
  .wcard { background: #fff; border: 1px solid #e5e8ef; border-radius: 10px;
    margin-bottom: 12px; overflow: hidden; }
  .wcard .whead { padding: 8px 12px; font-size: 12.5px; color: #5b6472;
    display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eef0f4; }
  .wcard .wslots { display: flex; flex-direction: column; }
  .wslot { padding: 8px 12px; font-size: 12.5px; border-top: 1px solid #f4f6f9; }
  .wslot:first-child { border-top: none; }
  .wslot .wtop { display: flex; align-items: center; gap: 6px; }
  .wslot .wname { font-weight: 600; color: #1f2329; }
  .wslot .wstat { margin-left: auto; font-size: 11.5px; color: #98a1af; }
  .wslot .wstat.ok { color: #34c77b; }
  .wslot .wstat.fail { color: #cf1322; }
  .wslot .wstat.run { color: #4f6ef7; }
  .wslot .wprev { margin-top: 5px; color: #444; background: #f7f8fa; border-radius: 6px;
    padding: 6px 9px; max-height: 140px; overflow: auto; white-space: pre-wrap; }
  .wact { padding: 8px 12px; border-top: 1px solid #eef0f4; display: flex; gap: 8px; align-items: center; }
  .wact .adopt { background: #34c77b; padding: 6px 14px; font-size: 12.5px; }
  .wact .adopt:disabled { background: #b9d9c7; }
  .wact .wnote { font-size: 11.5px; color: #98a1af; }
</style>
</head>
<body>
<header>
  <span class="logo">🤖</span>
  <h1>多功能智能体</h1>
  <select class="orchsel" id="orch" title="选择主智能体">
    <option value="">加载中…</option>
  </select>
  <span class="sub" id="status">本地运行 · 自研主控 + MCP + Skill</span>
</header>
<div id="chat"></div>
<footer>
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="输入任务，回车发送，Shift+回车换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">工具调用过程会以卡片形式展示 · 会话历史保存在 data/sessions/</div>
</footer>
<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const orchEl = document.getElementById('orch');
let sessionId = localStorage.getItem('agent_session_id') || null;
// 主智能体：启动时从 /api/agents 拉池列表，下拉切换后写回 localStorage，
// 避免每次刷新都要重选。空字符串表示"由后端用兜底单模型"。
let orchName = localStorage.getItem('agent_orchestrator') || '';
let busy = false;

// ---- 拉池内智能体列表填充下拉 ----
// 拉失败时不清空（保留上次选择），仅提示一次；列表为空时显示提示项。
async function loadOrchestrators() {
  if (!orchEl) return;
  try {
    const resp = await fetch('/api/agents');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const agents = Array.isArray(data.agents) ? data.agents : [];
    // 保存当前选择（列表刷新后还原）
    const prev = orchName;
    orchEl.innerHTML = '';
    if (agents.length === 0) {
      const empty = document.createElement('option');
      empty.value = '';
      empty.textContent = '（未配置智能体，将用兜底单模型）';
      orchEl.appendChild(empty);
      orchEl.disabled = true;
    } else {
      orchEl.disabled = false;
      // 第一项：默认（由后端决定，多池时选第一个）
      const def = document.createElement('option');
      def.value = '';
      def.textContent = '默认（由后端选择）';
      orchEl.appendChild(def);
      for (const a of agents) {
        const opt = document.createElement('option');
        opt.value = a.name;
        const note = a.note ? `（${a.note}）` : '';
        opt.textContent = `${a.name} · ${a.model}${note}`;
        orchEl.appendChild(opt);
      }
      // 还原选择（若上次的值不在新列表里则回落默认）
      const known = agents.some(a => a.name === prev);
      orchEl.value = known ? prev : '';
      orchName = orchEl.value;
      if (orchName) localStorage.setItem('agent_orchestrator', orchName);
      else localStorage.removeItem('agent_orchestrator');  // 回落默认时清掉过期值
    }
  } catch (e) {
    // 拉失败：保留旧值，只在第一次显示失败提示
    if (!orchEl.dataset.warned) {
      orchEl.dataset.warned = '1';
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '（主智能体列表加载失败）';
      orchEl.appendChild(opt);
    }
  }
}
orchEl && orchEl.addEventListener('change', () => {
  orchName = orchEl.value || '';
  if (orchName) localStorage.setItem('agent_orchestrator', orchName);
  else localStorage.removeItem('agent_orchestrator');
  // 主智能体是随会话绑定的（Agent 在创建时固定主模型，后端复用会话时会忽略新的
  // orchestrator）。所以切换后必须丢弃当前会话 id，下一条消息才会以新主开新会话——
  // 原实现只改 localStorage 不重置 sessionId，导致"切了主但仍是旧主"静默失效。
  sessionId = null;
  localStorage.removeItem('agent_session_id');
  statusEl.textContent = '已切换主智能体，下一条消息将开启新会话';
});
loadOrchestrators();

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderMd(s) {
  // 极简渲染：代码块、行内代码、加粗、换行
  let html = escapeHtml(s);
  html = html.replace(/```([\s\S]*?)```/g, (m, c) => '<pre class="codeblock">' + c.trim() + '</pre>');
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  return html;
}
function appendBubble(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = text ? renderMd(text) : '<span class="typing"><i></i><i></i><i></i></span>';
  row.appendChild(b);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return b;
}
function appendTool(name) {
  const box = document.createElement('div');
  box.className = 'tools';
  const d = document.createElement('details');
  d.className = 'tool';
  d.innerHTML = '<summary><span class="dot"></span>🔧 ' + escapeHtml(name) + '</summary>';
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}
function toolResult(d, text) {
  const pre = document.createElement('pre');
  pre.textContent = text && text.length > 800 ? text.slice(0, 800) + ' …[已截断]' : (text || '(无输出)');
  d.appendChild(pre);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ---- 并行派工卡（ask_workers 实时进度 + 采纳已完成）----
// worker_dispatch 建卡与逐工人骨架格；worker_result 就地填一格（快工人先亮）；
// 「采纳已完成」按钮打 /api/chat/cancel_tool 让后端停止等待未完成的工人。
let wcard = null;            // 当前派工卡根节点
let wslots = {};             // worker 名 -> {stat, prev} DOM 引用
let wdone = 0, wtotal = 0;
let wbtn = null;             // 采纳按钮引用

function startWorkerCard(ev) {
  wcard = document.createElement('div');
  wcard.className = 'wcard';
  const head = document.createElement('div');
  head.className = 'whead';
  wtotal = ev.total || (ev.workers || []).length || 0;
  wdone = 0;
  wslots = {};
  head.innerHTML = '👥 并行派工 · ' + wtotal + ' 个工人' +
    (ev.prompt_preview ? ' <span style="opacity:.6">— ' + escapeHtml(ev.prompt_preview.slice(0, 40)) + (ev.prompt_preview.length > 40 ? '…' : '') + '</span>' : '');
  const slots = document.createElement('div');
  slots.className = 'wslots';
  (ev.workers || []).forEach((w) => {
    const s = document.createElement('div');
    s.className = 'wslot';
    const top = document.createElement('div');
    top.className = 'wtop';
    top.innerHTML = '<span class="wname">' + escapeHtml(w) + '</span><span class="wstat run">⏳ 等待中…</span>';
    s.appendChild(top);
    slots.appendChild(s);
    wslots[w] = { root: s, stat: top.querySelector('.wstat'), prev: null };
  });
  wcard.appendChild(head);
  wcard.appendChild(slots);
  const act = document.createElement('div');
  act.className = 'wact';
  wbtn = document.createElement('button');
  wbtn.className = 'adopt';
  wbtn.textContent = '✅ 采纳已完成，结束派工';
  wbtn.disabled = true;  // 一个都没回来前不给点
  wbtn.onclick = adoptWorkers;
  const note = document.createElement('span');
  note.className = 'wnote';
  note.textContent = '快的先回来；满意就点采纳，不用等最慢的';
  act.appendChild(wbtn); act.appendChild(note);
  wcard.appendChild(act);
  chatEl.appendChild(wcard);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function fillWorkerSlot(ev) {
  const s = wslots[ev.worker];
  if (!s) return;
  wdone++;
  const ok = ev.ok;
  s.stat.className = 'wstat ' + (ok ? 'ok' : 'fail');
  s.stat.textContent = (ok ? '✓ ' : '✕ ') + (ev.elapsed_ms != null ? (ev.elapsed_ms / 1000).toFixed(1) + 's' : (ok ? '完成' : '未完成'));
  const prev = document.createElement('div');
  prev.className = 'wprev';
  const txt = ev.preview || '';
  prev.textContent = txt.length > 500 ? txt.slice(0, 500) + ' …' : (txt || '(空)');
  s.root.appendChild(prev);
  s.prev = prev;
  if (wbtn && wdone > 0) wbtn.disabled = false;
  if (wbtn) wbtn.textContent = '✅ 采纳已完成 (' + wdone + '/' + wtotal + ')，结束派工';
  chatEl.scrollTop = chatEl.scrollHeight;
}

function markWorkersCancelled(ev) {
  if (!wcard) return;
  (ev.skipped || []).forEach((w) => {
    const s = wslots[w];
    if (s && !s.prev) { s.stat.className = 'wstat fail'; s.stat.textContent = '⏹ 已结束等待'; }
  });
  if (wbtn) { wbtn.disabled = true; wbtn.textContent = '已结束派工'; }
  const n = wcard.querySelector('.wact .wnote');
  if (n) n.textContent = '已完成 ' + (ev.completed || []).length + ' 份，交给主智能体继续';
}

function endWorkerCard(finalText) {
  // ask_workers 的 tool_result 到达：把合并全文折进卡片，收尾并释放引用
  if (wcard) {
    const det = document.createElement('details');
    det.className = 'tool';
    det.style.margin = '0'; det.style.borderTop = '1px solid #eef0f4'; det.style.borderRadius = '0';
    det.innerHTML = '<summary>📄 派工合并结果（给主智能体的完整文本）</summary><pre>' +
      escapeHtml((finalText || '').slice(0, 4000)) + '</pre>';
    wcard.appendChild(det);
  }
  wcard = null; wslots = {}; wbtn = null;
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function adoptWorkers() {
  if (!wbtn) return;
  wbtn.disabled = true; wbtn.textContent = '结束派工中…';
  try {
    await fetch('/api/chat/cancel_tool', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId }),
    });
  } catch (e) {
    wbtn.disabled = false; wbtn.textContent = '采纳失败，可重试';
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  inputEl.value = ''; inputEl.style.height = 'auto';
  appendBubble('user', text);
  const bubble = appendBubble('assistant', '');
  let currentTool = null;
  wcard = null; wslots = {}; wbtn = null;  // 清掉上一轮可能残留的派工卡引用
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId, orchestrator: orchName || null }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx).trim(); buf = buf.slice(idx + 2);
        if (!chunk.startsWith('data: ')) continue;
        const payload = chunk.slice(6);
        if (payload === '[DONE]') continue;
        let ev; try { ev = JSON.parse(payload); } catch { continue; }
        if (ev.event === 'session') {
          sessionId = ev.session_id;
          localStorage.setItem('agent_session_id', sessionId);
          statusEl.textContent = '会话 ' + sessionId + ' · 自研主控 + MCP + Skill';
        } else if (ev.event === 'tool_start') {
          bubble.innerHTML = '';
          // ask_workers 用专门的派工卡渲染实时进度，不再叠一张通用工具卡
          if (ev.name === 'ask_workers') { currentTool = null; }
          else { currentTool = appendTool(ev.name); }
        } else if (ev.event === 'worker_dispatch') {
          startWorkerCard(ev);
        } else if (ev.event === 'worker_result') {
          fillWorkerSlot(ev);
        } else if (ev.event === 'worker_gather_cancelled') {
          markWorkersCancelled(ev);
        } else if (ev.event === 'tool_result') {
          if (wcard) { endWorkerCard(ev.preview); }
          else if (currentTool) { toolResult(currentTool, ev.preview); currentTool = null; }
        } else if (ev.event === 'final') {
          bubble.innerHTML = renderMd(ev.content || '(空回复)');
        } else if (ev.event === 'error') {
          const row = document.createElement('div');
          row.className = 'err';
          row.textContent = '出错了：' + ev.message;
          chatEl.appendChild(row);
          bubble.innerHTML = '';
        }
        chatEl.scrollTop = chatEl.scrollHeight;
      }
    }
  } catch (e) {
    bubble.innerHTML = '<span style="color:#cf1322">连接失败：' + escapeHtml(String(e)) + '</span>';
  }
  busy = false; sendBtn.disabled = false; inputEl.focus();
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});
</script>
</body>
</html>
