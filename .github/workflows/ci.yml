name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 同一个 PR/分支连续多次 push 时，只跑最新的一次：旧 run 的结果没人看，白占 runner。
# （cancel-in-progress 只在同一 group 内生效，所以 group 里带上 ref 把不同分支隔开。）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 子进程冒烟用例（test_smoke 起 `python -m agent`）单条上限 120-180s；没有这个值时
    # 一次挂死会一路耗到 GitHub 的 6 小时上限，把 queue 里的其它 PR 一起拖住。
    timeout-minutes: 20
    strategy:
      # requires-python 写的是 >=3.10，但过去只用 .python-version（3.14）跑过：
      # 下限从未被验证，用 3.11+ 才有的特性（tomllib / TaskGroup / datetime.UTC…）
      # 本地全绿、用户装 3.10 才崩。两条腿都跑，出问题在 PR 上就看得见。
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python }}
        # 版本号只来自上面的 matrix（矩阵是唯一显式来源）；要改支持的版本就改 matrix，
        # 不要在某个步骤里另写死一个数字——那样会与 .python-version 打架变成死步骤。
        run: uv python install ${{ matrix.python }}

      - name: Sync dependencies (incl. dev)
        run: uv sync --python ${{ matrix.python }}

      # 格式门禁放在 lint 之前：它失败是"风格没统一"，不该和真正的 lint 报错混在一起
      # 让人猜。本地对应命令：uv run ruff format .（写回）/ --check（只看）。
      - name: Ruff format check
        run: uv run --python ${{ matrix.python }} ruff format --check .

      - name: Ruff lint
        run: uv run --python ${{ matrix.python }} ruff check .

      - name: Pytest
        run: uv run --python ${{ matrix.python }} pytest

  # 回归门禁的第二半：确认那些"防回归"的用例不是恒真断言。
  # 单开一个 job（而不是挂在某条矩阵腿上）：这里要跑的 pytest 次数 = 变异条目数（几十次
  # 子进程启动），和主流水线串起来会把 lint+test 的反馈拖慢好几分钟；也不需要跟版本矩阵耦合。
  mutation-gate:
    needs: lint-and-test
    runs-on: ubuntu-latest
    # 这里要跑的 pytest 次数 = 变异条目数（几十次子进程启动），给足但不放任挂死。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies (incl. dev)
        # 版本仍由 .python-version 决定（不在这里重复写死版本号）
        run: uv sync

      - name: Mutation check
        run: uv run python tests/mutation_check.py
