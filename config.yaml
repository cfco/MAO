# ============================================
# 多功能智能体配置 v3 —— 纯结构骨架
# 本文件不写任何"值"：所有配置值都在 .env（端点/KEY/参数，保密不进 git），
# 所有模型名都在 model_registry.txt（随仓库维护，自动下线改写它）。
# 引用格式 ${变量} 或 ${变量:-默认值}（带默认值 = 不配也能跑的最小兜底）。
# 变量名必须与 .env / model_registry.txt 里的名字一一对应，填错则不生效。
# 所有 OpenAI 兼容 API 都能进池。池里全部成员都是"工人（子智能体）"——
# 主智能体由外部 AI 经 bridge/mcp/call 三外壳驱动，本项目不自带选主自己跑的入口。
# ============================================

# 智能体池：按"站"组织（一个中转站 = 一组 Endpoint+Key，可挂多个 Model）。
# name 唯一。models 引用 model_registry.txt 里的清单变量；临时屏蔽某模型 =
# 在它前面加 #（免费模型经常变，注释即下线，不用改代码）。
agents:
  - name: node-a                      # 中转站 A
    base_url: ${NODE_A_ENDPOINT}
    api_key: ${NODE_A_KEY}
    models: ${NODE_A_MODELS}          # 模型清单变量（model_registry.txt 维护）
    note: 中转站A免费token
  - name: node-b                      # 中转站 B
    base_url: ${NODE_B_ENDPOINT}
    api_key: ${NODE_B_KEY}
    models: ${NODE_B_MODELS}
    note: 中转站B免费token
#  - name: local-qwen                 # 单模型站（models 不填、用 model，兼容旧写法）
#    base_url: http://localhost:11434/v1
#    api_key: ""
#    model: qwen2.5:7b
#    note: 完全本地免 key

# 兜底单模型：ask 不带 agent 时用它（也可想直连官方 API 时用）。该路径也纳入
# 健康体系（合成键 solo:<model>）：终态失败当天隔离、瞬时失败短时冷却。
# 模型名在 model_registry.txt 的 LLM_MODEL 行（不自动下线，人工决定）。
llm:
  base_url: ${LLM_ENDPOINT}
  api_key: ${LLM_API_KEY}          # 在 .env 里配 LLM_API_KEY
  model: ${LLM_MODEL}
  temperature: ${LLM_TEMPERATURE:-0.7}
  # 免费节点友好：请求超时秒数 / 限流等可重试错误的最大重试次数(指数退避)
  timeout: ${LLM_TIMEOUT:-120}
  max_retries: ${LLM_MAX_RETRIES:-2}

collaboration:
  max_workers: ${COLLAB_MAX_WORKERS:-3}
  max_participants: ${COLLAB_MAX_PARTICIPANTS:-5}
  vote_threshold: ${COLLAB_VOTE_THRESHOLD:-0.5}
  cooldown_fails: ${COLLAB_COOLDOWN_FAILS:-2}
  cooldown_base: ${COLLAB_COOLDOWN_BASE:-10}
  # ---- 模型健康：当日失败隔离 + 连续运行日失败自动下线（见 agent/core/health.py）----
  health_file: ${COLLAB_HEALTH_FILE:-data/model_health.json}  # 健康档案落盘（当日失败标记，无密钥）
  retire_days: ${COLLAB_RETIRE_DAYS:-7}  # 连续 N 个"运行日"调用失败 → 在 model_registry.txt 给该模型加 # 下线
  fallback_models: ${COLLAB_FALLBACK_MODELS:-2}  # 单模型可重试失败后，同中转站最多回退的额外模型数（0=关闭）

tools:
  shell_timeout: ${TOOLS_SHELL_TIMEOUT:-120}  # 单条命令最长执行秒数
  # 额外允许工具访问的工作区目录（相对路径基于项目根，绝对路径原样使用）。
  # 为什么需要：MAO 常被用来驱动**别的项目**（在 MAO 里分析/改造另一个仓库），
  # 但工具层原先把路径硬绑在 MAO 自己的根上，主智能体连目标项目的文件都读不到，
  # "驱动外部项目"就成了空话。默认为空 = 仅限本项目根，原有安全边界不变。
  # 注意：配了就等于把这些目录的读写权一并交给主智能体，只加自己信任的项目。
  workspace: []                # 默认空 = 仅限本项目根。示例：
                               #   workspace: ["../other-proj", "D:/work/some-repo"]

# MCP server 列表，启动时自动连接并发现工具。示例：
# mcp_servers:
#   - name: filesystem
#     transport: stdio
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "D:/work/demo-dir"]
#   - name: remote-demo
#     transport: http
#     url: https://mcp.example.com/mcp
mcp_servers: []