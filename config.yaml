# ============================================
# 多功能智能体配置 v3 —— 纯结构骨架
# 本文件不写任何"值"：所有配置值都在 .env（端点/KEY/参数，保密不进 git），
# 所有模型名都在 model_registry.txt（随仓库维护，自动下线改写它）。
# 引用格式 ${变量} 或 ${变量:-默认值}（带默认值 = 不配也能跑的最小兜底）。
# 变量名必须与 .env / model_registry.txt 里的名字一一对应，填错则不生效。
# 所有 OpenAI 兼容 API 都能进池。池里全部成员都是"工人（子智能体）"——
# 主智能体由外部 AI 经 bridge/mcp/call 三外壳驱动，本项目不自带选主自己跑的入口。
# ============================================

# 智能体池：按"站"组织（一个中转站 = 一组 Endpoint+Key，可挂多个 Model）。
# name 唯一。models 引用 model_registry.txt 里的清单变量；临时屏蔽某模型 =
# 在它前面加 #（免费模型经常变，注释即下线，不用改代码）。
agents:
  - name: node-a                      # 中转站 A
    base_url: ${NODE_A_ENDPOINT}
    api_key: ${NODE_A_KEY}
    models: ${NODE_A_MODELS}          # 模型清单变量（model_registry.txt 维护）
    note: 中转站A免费token
  - name: node-b                      # 中转站 B
    base_url: ${NODE_B_ENDPOINT}
    api_key: ${NODE_B_KEY}
    models: ${NODE_B_MODELS}
    note: 中转站B免费token
#  - name: local-qwen                 # 单模型站（models 不填、用 model，兼容旧写法）
#    base_url: http://localhost:11434/v1
#    api_key: ""
#    model: qwen2.5:7b
#    note: 完全本地免 key

# 兜底单模型：ask 不带 agent 时用它（也可想直连官方 API 时用）。该路径也纳入
# 健康体系（合成键 solo:<model>）：终态失败当天隔离、瞬时失败短时冷却。
# 模型名在 model_registry.txt 的 LLM_MODEL 行（不自动下线，人工决定）。
llm:
  base_url: ${LLM_ENDPOINT}
  api_key: ${LLM_API_KEY}          # 在 .env 里配 LLM_API_KEY
  model: ${LLM_MODEL}
  temperature: ${LLM_TEMPERATURE:-0.7}
  # 免费节点友好：请求超时秒数 / 限流等可重试错误的最大重试次数(指数退避)
  timeout: ${LLM_TIMEOUT:-120}
  max_retries: ${LLM_MAX_RETRIES:-2}

collaboration:
  # 省 token 开关（二元）：true=主智能体在派工协作时优先省自己的 token。
  # MAO 层只把这个开关随协议带出/可改，**不会**自行判断"分工还是重复验证"，
  # 模式判断全部留给外部主（见 docs/外部主接入指南.md §3.1 set_economy）。
  economy: ${COLLAB_ECONOMY:-false}
  max_workers: ${COLLAB_MAX_WORKERS:-3}
  # 同一中转站（base_url+api_key）同时允许在飞的请求数，默认 **1**（一站同时只跑一个模型）。
  # 一站多模型共用同一份配额/同一条网关，并发打过去只在站端互相排队拖慢，还会把
  # 「延迟档案」里的真实往返污染成"这个模型慢"（选路正是按这份档案裁剪）。
  # 串行后并行度 = min(max_workers, 本值 × 本批涉及站数)：跨站才真并行。
  # 想要旧的"只看总并发"行为就把它调大（例如 ≥ 站内模型数）。
  max_per_station: ${COLLAB_MAX_PER_STATION:-1}
  max_participants: ${COLLAB_MAX_PARTICIPANTS:-5}
  vote_threshold: ${COLLAB_VOTE_THRESHOLD:-0.5}
  cooldown_fails: ${COLLAB_COOLDOWN_FAILS:-2}
  cooldown_base: ${COLLAB_COOLDOWN_BASE:-10}
  # 冷却指数退避封顶（秒）：连续失败越多、冷却越久（base × 2^n），到顶后恒定不再增长。
  cooldown_max: ${COLLAB_COOLDOWN_MAX:-3600}
  # ---- 模型健康：当日失败隔离 + 连续运行日失败自动下线（见 agent/core/health.py）----
  health_file: ${COLLAB_HEALTH_FILE:-data/model_health.json}  # 健康档案落盘（当日失败标记，无密钥）
  retire_days: ${COLLAB_RETIRE_DAYS:-7}  # 连续 N 个"运行日"调用失败 → 在 model_registry.txt 给该模型加 # 下线
  fallback_models: ${COLLAB_FALLBACK_MODELS:-2}  # 单模型可重试失败后，最多回退的额外模型数（0=关闭）
  # 回退候选是否允许跨中转站（默认 true）：同站无可用候选时从整池恢复（异常停止自动换模型）。
  fallback_cross_station: ${COLLAB_FALLBACK_CROSS_STATION:-true}
  # ---- 模型延迟档案：可用的模型里再比"快不快"（见 agent/core/latency.py）----
  latency_file: ${COLLAB_LATENCY_FILE:-data/model_latency.json}  # 往返耗时样本落盘（只记毫秒数，无密钥）
  # 延迟自动探测：每 latency_probe_interval 秒对**全部节点（含当前不可用节点）**打一次
  # 极短往返刷新档案；pick() 据此排序、优先派给延迟低的可用模型。MAO_LATENCY_PROBE=0 可关。
  latency_probe: ${COLLAB_LATENCY_PROBE:-true}
  latency_probe_interval: ${COLLAB_LATENCY_PROBE_INTERVAL:-600}  # 秒：默认 10 分钟一轮
  # 探测专用短超时（秒）：**不**沿用派工的 llm.timeout。坏节点也只拖本值秒、且探测客户端不重试，
  # 免得一次测速被拖成分钟级、或同步 probe（latency probe:true）挂住整轮。
  latency_probe_timeout: ${COLLAB_LATENCY_PROBE_TIMEOUT:-8}
  # 只用延迟最低的这部分（默认 0.6 = 弃掉最高延迟的 40%）；小池同样适用
  # （n=5→3、4→3、3→2、2→2），即"可用低于 5 个就用最低的 2~3 个"。
  latency_keep_ratio: ${COLLAB_LATENCY_KEEP_RATIO:-0.6}
  # 已知延迟的候选少于该数则不裁剪（冷启动保护：没数据就不动刀）
  latency_min_samples: ${COLLAB_LATENCY_MIN_SAMPLES:-2}

tools:
  shell_timeout: ${TOOLS_SHELL_TIMEOUT:-120}  # 单条命令最长执行秒数
  # 额外允许工具访问的工作区目录（相对路径基于项目根，绝对路径原样使用）。
  # 为什么需要：MAO 常被用来驱动**别的项目**（在 MAO 里分析/改造另一个仓库），
  # 但工具层原先把路径硬绑在 MAO 自己的根上，主智能体连目标项目的文件都读不到，
  # "驱动外部项目"就成了空话。默认为空 = 仅限本项目根，原有安全边界不变。
  # 注意：配了就等于把这些目录的读写权一并交给主智能体，只加自己信任的项目。
  workspace: []                # 默认空 = 仅限本项目根。示例：
                               #   workspace: ["../other-proj", "D:/work/some-repo"]

# MCP server 列表，启动时自动连接并发现工具。示例：
# mcp_servers:
#   - name: filesystem
#     transport: stdio
#     command: npx
#     args: ["-y", "@modelcontextprotocol/server-filesystem", "D:/work/demo-dir"]
#   - name: remote-demo
#     transport: http
#     url: https://mcp.example.com/mcp
mcp_servers: []